name: CAK3D Android build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --flavor production --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: classipod-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
